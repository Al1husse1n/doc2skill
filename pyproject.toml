[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doc2skill"
version = "0.1.0"
description = "A Python CLI tool that converts documentation into agent skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "google-genai>=2.0.0",
    "httpx>=0.27.0",
    "trafilatura>=2.0.0",
    "ultimate-sitemap-parser>=1.8.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-recording>=0.14.0",
]

[project.scripts]
doc2skill = "doc2skill.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["doc2skill*"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
filterwarnings = [
    "ignore:.*allowed_objects.*:Warning",
]

